<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <!-- Background gradient: deep navy → dark slate -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="55%"  stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#101c38"/>
    </linearGradient>

    <!-- Shield glow -->
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0078d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent pulse ring -->
    <radialGradient id="pulseRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#50e6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#50e6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- MCP badge gradient -->
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#004578"/>
    </linearGradient>

    <!-- Subtle grid clip -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.045"/>
    </pattern>

    <!-- Clip path for shield -->
    <clipPath id="shieldClip">
      <path d="M128 44 L200 44 L200 108 Q200 152 164 172 Q128 152 128 108 Z"/>
    </clipPath>

    <!-- Drop shadow for main title -->
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle glow for shield icon -->
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────────── -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Subtle top accent bar -->
  <rect width="1280" height="2" y="0" fill="#0078d4" opacity="0.7"/>

  <!-- Faint ambient glow behind the shield -->
  <ellipse cx="164" cy="120" rx="120" ry="100" fill="url(#pulseRing)"/>

  <!-- ── Shield Icon ─────────────────────────────────────────────────────── -->
  <!-- Outer glow ring -->
  <ellipse cx="164" cy="116" rx="68" ry="68" fill="url(#shieldGlow)" filter="url(#iconGlow)"/>

  <!-- Shield body -->
  <path d="M164 48 L218 70 L218 112 Q218 162 164 188 Q110 162 110 112 L110 70 Z"
        fill="none" stroke="#0078d4" stroke-width="2.5" opacity="0.9"/>
  <path d="M164 56 L212 76 L212 112 Q212 156 164 180 Q116 156 116 112 L116 76 Z"
        fill="#0078d4" fill-opacity="0.12"/>

  <!-- Shield inner circuit lines -->
  <g stroke="#50e6ff" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
    <line x1="164" y1="80" x2="164" y2="100"/>
    <line x1="148" y1="96" x2="180" y2="96"/>
    <circle cx="164" cy="108" r="6" fill="none"/>
    <line x1="164" y1="114" x2="164" y2="134"/>
    <line x1="148" y1="128" x2="164" y2="134"/>
    <line x1="180" y1="128" x2="164" y2="134"/>
    <circle cx="148" cy="128" r="2.5" fill="#50e6ff"/>
    <circle cx="180" cy="128" r="2.5" fill="#50e6ff"/>
    <circle cx="164" cy="96" r="2.5" fill="#50e6ff"/>
  </g>

  <!-- AI node dots (suggest neural network) -->
  <g fill="#50e6ff" opacity="0.4">
    <circle cx="132" cy="90" r="2"/>
    <circle cx="196" cy="90" r="2"/>
    <circle cx="132" cy="140" r="2"/>
    <circle cx="196" cy="140" r="2"/>
  </g>
  <g stroke="#50e6ff" stroke-width="0.7" opacity="0.2">
    <line x1="132" y1="90" x2="148" y2="96"/>
    <line x1="196" y1="90" x2="180" y2="96"/>
    <line x1="132" y1="140" x2="148" y2="128"/>
    <line x1="196" y1="140" x2="180" y2="128"/>
  </g>

  <!-- ── Connection line from shield to text ─────────────────────────────── -->
  <line x1="236" y1="118" x2="268" y2="118" stroke="#0078d4" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- ── Main Title ──────────────────────────────────────────────────────── -->
  <text x="286" y="112"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-1"
        fill="#ffffff"
        filter="url(#textGlow)">Sentinel</text>

  <text x="286" y="112"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-1"
        fill="url(#mcpGrad)"
        fill-opacity="0"
        stroke="#ffffff"
        stroke-width="0">Sentinel</text>

  <!-- "Foundry" in accent blue -->
  <text x="758" y="112"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="300"
        letter-spacing="2"
        fill="#50e6ff"
        opacity="0.92">Foundry</text>

  <!-- ── Subtitle ────────────────────────────────────────────────────────── -->
  <text x="286" y="155"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="0.5"
        fill="#b0c4de"
        opacity="0.88">AI Intelligence Layer for Microsoft Sentinel</text>

  <!-- ── Horizontal rule ────────────────────────────────────────────────── -->
  <line x1="286" y1="175" x2="980" y2="175" stroke="#1f4068" stroke-width="1"/>

  <!-- ── Feature pills ──────────────────────────────────────────────────── -->
  <!-- Pill 1: MCP Protocol -->
  <rect x="286" y="192" width="148" height="30" rx="15" fill="#0d2137" stroke="#0078d4" stroke-width="1" opacity="0.9"/>
  <text x="360" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500"
        fill="#50e6ff" text-anchor="middle" opacity="0.95">MCP Protocol</text>

  <!-- Pill 2: 43 Tools -->
  <rect x="446" y="192" width="130" height="30" rx="15" fill="#0d2137" stroke="#0078d4" stroke-width="1" opacity="0.9"/>
  <text x="511" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500"
        fill="#50e6ff" text-anchor="middle" opacity="0.95">43+ AI Tools</text>

  <!-- Pill 3: MITRE ATT&CK -->
  <rect x="588" y="192" width="168" height="30" rx="15" fill="#0d2137" stroke="#0078d4" stroke-width="1" opacity="0.9"/>
  <text x="672" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500"
        fill="#50e6ff" text-anchor="middle" opacity="0.95">MITRE ATT&amp;CK</text>

  <!-- Pill 4: Azure Sentinel -->
  <rect x="768" y="192" width="168" height="30" rx="15" fill="#0d2137" stroke="#0078d4" stroke-width="1" opacity="0.9"/>
  <text x="852" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500"
        fill="#50e6ff" text-anchor="middle" opacity="0.95">Azure Sentinel</text>

  <!-- ── Works with row ──────────────────────────────────────────────────── -->
  <text x="286" y="258"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="12"
        fill="#6b8299"
        letter-spacing="1"
        font-weight="600">WORKS WITH</text>

  <!-- VS Code logo (simplified) -->
  <g transform="translate(374, 244)" opacity="0.75">
    <rect width="28" height="28" rx="5" fill="#0066b8"/>
    <text x="14" y="20" font-size="14" text-anchor="middle" fill="white" font-family="monospace" font-weight="700">&gt;_</text>
  </g>
  <text x="408" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8aa8c0">VS Code</text>

  <!-- Claude logo (simplified circle) -->
  <g transform="translate(482, 244)" opacity="0.75">
    <circle cx="14" cy="14" r="14" fill="#d97706"/>
    <text x="14" y="19" font-size="13" text-anchor="middle" fill="white" font-family="serif" font-weight="700">C</text>
  </g>
  <text x="502" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8aa8c0">Claude</text>

  <!-- Generic MCP client icon -->
  <g transform="translate(570, 244)" opacity="0.75">
    <rect width="28" height="28" rx="5" fill="#2d6a4f"/>
    <text x="14" y="20" font-size="13" text-anchor="middle" fill="white" font-family="monospace" font-weight="700">M</text>
  </g>
  <text x="604" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8aa8c0">Any MCP Client</text>

  <!-- ── Kiranlab credit ─────────────────────────────────────────────────── -->
  <text x="1252" y="300"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11"
        fill="#2a4a6b"
        text-anchor="end">kiranlab.co.uk</text>

  <!-- Right decorative circuit lines -->
  <g stroke="#0078d4" stroke-width="0.8" opacity="0.18">
    <line x1="1060" y1="40"  x2="1060" y2="280"/>
    <line x1="1100" y1="40"  x2="1100" y2="280"/>
    <line x1="1060" y1="80"  x2="1120" y2="80"/>
    <line x1="1060" y1="140" x2="1140" y2="140"/>
    <line x1="1060" y1="200" x2="1180" y2="200"/>
    <line x1="1060" y1="240" x2="1120" y2="240"/>
    <circle cx="1060" cy="80"  r="3" fill="#0078d4" opacity="0.6"/>
    <circle cx="1060" cy="140" r="3" fill="#50e6ff" opacity="0.5"/>
    <circle cx="1060" cy="200" r="3" fill="#0078d4" opacity="0.6"/>
    <circle cx="1060" cy="240" r="3" fill="#50e6ff" opacity="0.4"/>
    <circle cx="1120" cy="80"  r="2" fill="#50e6ff" opacity="0.4"/>
    <circle cx="1140" cy="140" r="2" fill="#0078d4" opacity="0.5"/>
    <circle cx="1180" cy="200" r="2" fill="#50e6ff" opacity="0.4"/>
    <circle cx="1120" cy="240" r="2" fill="#0078d4" opacity="0.5"/>
  </g>

  <!-- Bottom accent bar -->
  <rect y="318" width="1280" height="2" fill="url(#mcpGrad)" opacity="0.5"/>
</svg>
