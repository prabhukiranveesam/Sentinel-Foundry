<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#091520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4a261;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9c46a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#00b4d8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Decorative circuit-like dots at grid intersections -->
  <g fill="#00b4d8" opacity="0.15">
    <circle cx="200" cy="80" r="2.5"/><circle cx="400" cy="80" r="2.5"/><circle cx="600" cy="80" r="2.5"/>
    <circle cx="800" cy="80" r="2.5"/><circle cx="1000" cy="80" r="2.5"/>
    <circle cx="200" cy="160" r="2.5"/><circle cx="400" cy="160" r="2.5"/><circle cx="600" cy="160" r="2.5"/>
    <circle cx="800" cy="160" r="2.5"/><circle cx="1000" cy="160" r="2.5"/>
    <circle cx="200" cy="240" r="2.5"/><circle cx="400" cy="240" r="2.5"/><circle cx="600" cy="240" r="2.5"/>
    <circle cx="800" cy="240" r="2.5"/><circle cx="1000" cy="240" r="2.5"/>
    <circle cx="200" cy="320" r="2.5"/><circle cx="400" cy="320" r="2.5"/><circle cx="600" cy="320" r="2.5"/>
    <circle cx="800" cy="320" r="2.5"/><circle cx="1000" cy="320" r="2.5"/>
  </g>

  <!-- Shield icon (left side) -->
  <g transform="translate(80, 120)" filter="url(#glow-strong)">
    <!-- Shield shape -->
    <path d="M60 0 L120 25 L120 80 Q120 130 60 155 Q0 130 0 80 L0 25 Z"
          fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <!-- Inner shield fill subtle -->
    <path d="M60 0 L120 25 L120 80 Q120 130 60 155 Q0 130 0 80 L0 25 Z"
          fill="#00b4d8" opacity="0.06"/>
    <!-- Check/bolt inside shield -->
    <path d="M35 72 L52 90 L85 55" fill="none" stroke="#00b4d8" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Gold dot at top of shield -->
    <circle cx="60" cy="6" r="5" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- Top accent bar -->
  <rect x="230" y="88" width="800" height="2" fill="url(#accent)" opacity="0.4"/>

  <!-- SENTINEL FOUNDRY — main title -->
  <text x="245" y="172" font-family="'Segoe UI', 'Arial', sans-serif" font-size="64"
        font-weight="700" letter-spacing="3" fill="white" opacity="0.97">
    SENTINEL
  </text>
  <text x="650" y="172" font-family="'Segoe UI', 'Arial', sans-serif" font-size="64"
        font-weight="300" letter-spacing="3" fill="url(#gold)" opacity="0.95">
    FOUNDRY
  </text>

  <!-- Tagline -->
  <text x="245" y="218" font-family="'Segoe UI', 'Arial', sans-serif" font-size="22"
        font-weight="300" letter-spacing="1.5" fill="#90e0ef" opacity="0.85">
    AI-Powered Microsoft Sentinel Intelligence via Model Context Protocol
  </text>

  <!-- Divider line with glow -->
  <rect x="245" y="238" width="700" height="1.5" fill="url(#accent)" opacity="0.5" filter="url(#glow)"/>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="245" y="260" width="188" height="34" rx="17" fill="#00b4d8" opacity="0.12" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="339" y="282" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14"
        font-weight="500" fill="#90e0ef" text-anchor="middle" opacity="0.9">38 Intelligent Tools</text>

  <!-- Pill 2 -->
  <rect x="445" y="260" width="168" height="34" rx="17" fill="#00b4d8" opacity="0.12" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="529" y="282" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14"
        font-weight="500" fill="#90e0ef" text-anchor="middle" opacity="0.9">MITRE ATT&amp;CK Coverage</text>

  <!-- Pill 3 -->
  <rect x="625" y="260" width="158" height="34" rx="17" fill="#00b4d8" opacity="0.12" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="704" y="282" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14"
        font-weight="500" fill="#90e0ef" text-anchor="middle" opacity="0.9">Real-Time Analytics</text>

  <!-- Pill 4 -->
  <rect x="795" y="260" width="152" height="34" rx="17" fill="#e9c46a" opacity="0.12" stroke="#e9c46a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="871" y="282" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14"
        font-weight="500" fill="#e9c46a" text-anchor="middle" opacity="0.9">VS Code + Claude</text>

  <!-- Bottom line: connect URL hint -->
  <text x="245" y="345" font-family="'Courier New', monospace" font-size="16"
        fill="#00b4d8" opacity="0.6" letter-spacing="0.5">
    https://mcp.kiranlab.co.uk/sentinel
  </text>

  <!-- Powered by Microsoft Sentinel badge -->
  <text x="245" y="375" font-family="'Segoe UI', 'Arial', sans-serif" font-size="13"
        font-weight="400" fill="#ffffff" opacity="0.35" letter-spacing="1">
    POWERED BY MICROSOFT SENTINEL  ·  AZURE AI  ·  MODEL CONTEXT PROTOCOL
  </text>

  <!-- Decorative right-side data flow lines -->
  <g opacity="0.12" stroke="#00b4d8" stroke-width="1.5" fill="none">
    <path d="M1080 50 Q1120 100 1100 150 Q1080 200 1120 250 Q1150 290 1130 340"/>
    <path d="M1110 50 Q1140 110 1120 170 Q1100 220 1140 270 Q1160 300 1150 360"/>
    <path d="M1150 80 Q1170 130 1155 190 Q1140 240 1170 290"/>
  </g>

  <!-- Glowing dots on right decorative lines -->
  <circle cx="1100" cy="150" r="4" fill="#00b4d8" opacity="0.5" filter="url(#glow)"/>
  <circle cx="1120" cy="250" r="4" fill="#00b4d8" opacity="0.4" filter="url(#glow)"/>
  <circle cx="1140" cy="170" r="3" fill="#e9c46a" opacity="0.5" filter="url(#glow)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#accent)" opacity="0.6"/>
</svg>
